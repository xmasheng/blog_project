<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ space.title }}</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="personal-space">

    <header class="space-header">
        <h1>{{ space.title }}</h1>
        <p>Welcome to my world</p>
    </header>

    <div class="space-layout">

        <aside class="sidebar">

            <div class="profile-card">
                <div class="avatar">👤</div>
                <h2>{{ username }}</h2>
                <p>My space。</p>
            </div>

            <div class="widget" id="about">
                <h3>關於我</h3>
                <p>歡迎來到我的有名大站。</p>
            </div>

            <div class="widget">
                <h3>空間選單</h3>
                <a href="#diary">我的日誌</a>
                <a href="#about">個人介紹</a>
            </div>

        </aside>

        <main class="diary-main" id="diary">

            <h2>我的日誌</h2>

            {% if posts %}

                {% for post in posts %}

                <article class="diary-post">

                    <h3>{{ post.title }}</h3>
                    <a href="/u/{{ username }}/posts/{{ post.id }}/edit">
                        編輯日誌
                    </a>
                    <form
                         action="/u/{{ username }}/posts/{{ post.id }}/delete"
                         method="post"
                         onsubmit="return confirm('確定要刪除這篇日誌嗎？');"
                    >
                         <button type="submit">刪除日誌</button>
                    </form>
                    <div class="post-date">
                        {{ post.date }}
                    </div>

                    <p>{{ post.content }}</p>

                </article>

                {% endfor %}

            {% else %}

                <div class="empty-posts">
                    <p>目前還沒有發表任何日誌。</p>
                </div>

            {% endif %}

        </main>

    </div>

    <footer class="space-footer">
        This is my personal space.
    </footer>

</div>

</body>
</html>
